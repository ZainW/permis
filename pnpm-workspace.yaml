catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
packages:
  - packages/*
onlyBuiltDependencies:
  - better-sqlite3
  - sharp
  - workerd
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
